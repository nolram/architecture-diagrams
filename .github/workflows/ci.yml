name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm run validate:skill

      - name: Render examples (smoke test)
        run: |
          for spec in examples/*.yaml; do
            node dist/cli.js "$spec" --png -o /tmp/"$(basename "$spec" .yaml)".svg
          done
