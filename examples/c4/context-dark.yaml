# C4 diagram spec (type: c4)
#
# Visual-validation example: the MIDNIGHT-DARK theme (dark canvas, dark-tinted
# cards, light text). Check the contrast of the person silhouette, the dashed
# external-system boxes, the edge labels, and the legend on the dark background.
#
# Domain: the same online shop as context.yaml, rendered in the dark palette.

type: c4
version: '1'
level: context
title: Online Shop — System Context (dark theme)
theme: midnight-dark
direction: auto

elements:
  - id: user
    name: Web User
    type: person
    description: Shops for products
  - id: shop
    name: Online Shop
    type: system
    description: Sells products online
    technology: Node.js
  - id: stripe
    name: Stripe
    type: external-system
    description: Payment processing
    technology: SaaS
  - id: sendgrid
    name: SendGrid
    type: external-system
    description: Email delivery

relationships:
  - from: user
    to: shop
    description: browses and buys
  - from: shop
    to: stripe
    description: charges cards
    technology: HTTPS
  - from: shop
    to: sendgrid
    description: sends receipts
