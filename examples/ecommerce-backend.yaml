version: '1'
title: E-commerce Backend Architecture
theme: clean-light
nodes:
  - id: client
    label: Web Client
    sublabel: Browser / SPA
    icon: generic:browser
    category: external
  - id: gateway
    label: API Gateway
    sublabel: Routing, authN, rate limiting
    icon: aws:api-gateway
    category: network
  - id: orders
    label: Orders Service
    sublabel: Order management
    icon: generic:service
    category: compute
    group: vpc
  - id: payments
    label: Payments Service
    sublabel: Payment processing
    icon: generic:service
    category: compute
    group: vpc
  - id: redis
    label: Redis
    sublabel: Session cache
    icon: brand:redis
    category: database
    group: vpc
  - id: queue
    label: Message Queue
    sublabel: Async payments
    icon: generic:queue
    category: messaging
    group: vpc
  - id: postgres
    label: PostgreSQL
    sublabel: Main database
    icon: brand:postgresql
    category: database
    group: vpc
groups:
  - id: vpc
    label: VPC — Private Network
    style: vpc
edges:
  - from: client
    to: gateway
    label: HTTPS / REST
  - from: gateway
    to: orders
    label: REST
  - from: gateway
    to: payments
    label: REST
  - from: gateway
    to: redis
    label: session R/W
  - from: orders
    to: postgres
    label: order data
  - from: payments
    to: postgres
    label: payment data
  - from: payments
    to: queue
    label: publish / consume (async)
    style: dashed
    direction: bidirectional
