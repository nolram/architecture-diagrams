version: '1'
title: Arquitetura de Backend — E-commerce
theme: clean-light
nodes:
  - id: client
    label: Cliente Web
    sublabel: Browser / SPA
    icon: generic:browser
    category: external
  - id: gateway
    label: API Gateway
    sublabel: Roteamento, authN, rate limiting
    icon: aws:api-gateway
    category: network
  - id: orders
    label: Orders Service
    sublabel: Gerenciamento de pedidos
    icon: generic:service
    category: compute
    group: vpc
  - id: payments
    label: Payments Service
    sublabel: Processamento de pagamentos
    icon: generic:service
    category: compute
    group: vpc
  - id: redis
    label: Redis
    sublabel: Cache de sessão
    icon: brand:redis
    category: database
    group: vpc
  - id: queue
    label: Message Queue
    sublabel: Pagamentos assíncronos
    icon: generic:queue
    category: messaging
    group: vpc
  - id: postgres
    label: PostgreSQL
    sublabel: Banco de dados principal
    icon: brand:postgresql
    category: database
    group: vpc
groups:
  - id: vpc
    label: VPC — Rede Privada
    style: vpc
edges:
  - from: client
    to: gateway
    label: HTTPS / REST
  - from: gateway
    to: orders
    label: REST
  - from: gateway
    to: payments
    label: REST
  - from: gateway
    to: redis
    label: sessão R/W
  - from: orders
    to: postgres
    label: dados de pedidos
  - from: payments
    to: postgres
    label: dados de pagamentos
  - from: payments
    to: queue
    label: publish / consome (assíncrono)
    style: dashed
    direction: bidirectional
